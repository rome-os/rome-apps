formatVersion: 1
id: summary
name: Summary
version: 0.2.2
description: Work summary generator — aggregates webchat conversations, channel messages, and GitHub activity into structured reports by project.
tagline: "Your week's chats, channels, and GitHub activity, summarized by project."
appRoot: dist

web:
  manifest: web/manifest.json
  displayName: Summary
  navLabel: Summary

db:
  migrations: db/migrations
  tablePrefix: summary

api:
  entry: api/index

actions:
  - actions/generate-summary
  - actions/ask-agent

agents:
  - agents/summary.yaml
