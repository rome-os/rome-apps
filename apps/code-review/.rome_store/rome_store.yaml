long_description: |
  Every pull request deserves a fast first pass. Code Review watches your
  GitHub repositories, reviews each pull request with an agent, and posts the
  result back to GitHub as an ordinary review with inline comments.

  ## Why install it

  - **Catch issues before review time is spent.** Bugs, risky edge cases,
    security concerns, performance regressions, and maintainability problems
    surface early.
  - **Keep pull requests moving.** Solo projects and small teams get a second
    set of eyes when nobody is immediately available.
  - **Make reviews consistent.** The same baseline checks apply to every pull
    request, so humans can focus on architecture and product judgment.
  - **Stay inside GitHub.** Findings appear as inline comments with a verdict
    and a summary, where the code discussion already happens.

  ## What it does

  - Monitors the repositories you add from the Rome dashboard.
  - Runs automatically when pull requests open or receive new commits.
  - Also runs on demand, on a GitHub review request, or on a mention command.
  - Posts line-level findings plus a concise summary and verdict.
  - Takes per-repository review instructions.
  - Allows selected GitHub users, or everyone except the people you block.
  - Keeps a review history dashboard in Rome for status and follow-up.

  It does not replace human review. It handles the repetitive first pass so
  people can spend their attention on decisions that need judgment.
