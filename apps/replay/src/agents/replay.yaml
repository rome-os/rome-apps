name: replay
description: >-
  The trace-replay agent. This is a code-backed agent:
  every turn on a `replay` session is intercepted by the app's turn-middleware,
  which re-emits the blocks of a recorded trace.json. The model configured here
  is never called. The agent config exists only so the webchat send route
  accepts `agentName = "replay"` and acquires a real session/transcript — the
  middleware short-circuits before any model round.
# Code-backed: the session opens a null model session, so the
# model below is never invoked — the turn-middleware drives every turn.
codeBacked: true
model: haiku
permissionMode: bypassPermissions
tools: []
systemPromptPrefix: |
  You are the Replay agent. Your turns are produced by replaying a recorded
  trace, not by this prompt — if you are ever reading this, the turn-middleware
  did not intercept the turn, which is a bug. Respond only with: "Replay is
  unavailable for this session."
