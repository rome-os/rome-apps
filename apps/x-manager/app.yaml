formatVersion: 1
id: x-manager
name: X Manager
version: 0.3.1
description: X (Twitter) account management — check login, learn brand voice, create content, reply to comments, and poll metrics
icon: assets/icon.svg
appRoot: dist

web:
  manifest: web/manifest.json
  displayName: X Manager
  navLabel: X

api:
  entry: api/index

db:
  migrations: db/migrations
  tablePrefix: x

actions:
  - actions/check-login
  - actions/learn-brand-voice
  - actions/fetch-tweets
  - actions/post-tweet
  - actions/reply-tweet
  - actions/poll-metrics
  - actions/fetch-notifications

agents:
  - agents/content-editor.yaml
  - agents/comment-reply.yaml

skills:
  - skills/x-operations
