formatVersion: 1
id: discord-digest
name: Discord Digest
version: 0.8.8
description: Periodically summarizes Discord channel messages and posts the digest back as a bot message.
tagline: "Your Discord channels, summarized on a schedule."
icon: assets/icon.svg
appRoot: dist

web:
  manifest: web/manifest.json
  displayName: Discord Digest
  navLabel: Discord Digest

api:
  entry: api/index

db:
  migrations: db/migrations
  tablePrefix: discord_digest

actions:
  - actions/run-digest
  - actions/read-attachment
  - actions/read-link

agents:
  - agents/summarizer.yaml
