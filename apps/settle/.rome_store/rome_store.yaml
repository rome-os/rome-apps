title: Settle
description: Send a polished favor request for work you've done, and see who's paid.
long_description: |
  Settle turns help you've already given into a clean favor request. Describe the
  work, pick an amount, and share the link Settle generates. The pay page
  introduces you with your photo and bio and lets the other person pay with Rome
  Cloud favors after confirming the exact amount. Your dashboard shows every
  request's progress — sent, opened, paying, paid — and notifies you when one is
  settled.
